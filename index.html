<style>

  margin:0; background:#08051b; color:white;

  background:#8b42db; color:white; border:0;

<body>
<h2>🚀 ESMA SPACE GAME</h2>
<p>Score: <span id="score">0</span> |
Lives: <span id="lives">3</span></p>
<canvas id="game"></canvas>
<button id="start">START GAME</button>
<p>Touch and drag to move. Hold to shoot!</p>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");
c.width=innerWidth;
c.height=innerHeight*0.75;

let player={x:c.width/2,y:c.height-65};
let enemies=[],bullets=[],score=0,lives=3;
let running=false,shoot=false,frame=0;

function drawPlayer(){
 ctx.fillStyle="#bd75ff";
 ctx.beginPath();
 ctx.moveTo(player.x,player.y-25);
 ctx.lineTo(player.x-20,player.y+20);
 ctx.lineTo(player.x+20,player.y+20);
 ctx.closePath();ctx.fill();
}

function spawn(){
 enemies.push({
  x:Math.random()*(c.width-35)+17,
  y:-25,speed:2+Math.random()*2
 });
}

function loop(){
 if(!running)return;
 ctx.clearRect(0,0,c.width,c.height);

 // Stars
 for(let i=0;i<25;i++){
  ctx.fillStyle="white";
  ctx.fillRect((i*83)%c.width,(i*137+frame*2)%c.height,2,2);
 }

 drawPlayer();

 if(frame%55===0)spawn();

 if(shoot && frame%12===0){
  bullets.push({x:player.x,y:player.y-25});
 }

 bullets.forEach((b,i)=>{
  b.y-=8;
  ctx.fillStyle="#a8faff";
  ctx.fillRect(b.x-2,b.y,4,14);
  if(b.y<0)bullets.splice(i,1);
 });

 enemies.forEach((e,i)=>{
  e.y+=e.speed;
  ctx.font="25px Arial";
  ctx.fillText("🐔",e.x-12,e.y);
  bullets.forEach((b,j)=>{
   if(Math.abs(b.x-e.x)<22 && Math.abs(b.y-e.y)<22){
    enemies.splice(i,1);
    bullets.splice(j,1);
    score+=10;
    document.getElementById("score").textContent=score;
   }
  });
  if(e.y>c.height){
   enemies.splice(i,1);
   lives--;
   document.getElementById("lives").textContent=lives;
  }
 });

 frame++;

 if(lives<=0){
  running=false;
  ctx.fillStyle="white";
  ctx.font="30px Arial";
  ctx.fillText("GAME OVER",c.width/2-95,c.height/2);
  document.getElementById("start").textContent="PLAY AGAIN";
  return;
 }
 requestAnimationFrame(loop);
}
